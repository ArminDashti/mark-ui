name: mark-ui

services:
  mark-ui:
    image: ${IMAGE_TAG:-mark-ui:latest}
    container_name: mark-ui
    expose:
      - "80"
    environment:
      API_HOST: ${API_HOST:-mark-api}
      API_PORT: ${API_PORT:-8130}
    networks:
      - t3-net
    restart: unless-stopped

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true
